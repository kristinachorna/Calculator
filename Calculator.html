<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pretty Calculator</title>

   <style>
      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
         font-family: "Segoe UI", Arial, sans-serif;
         background: linear-gradient(135deg, #f8c8dc, #d8c7ff);
      }

      .calculator {
         width: 330px;
         padding: 25px;
         background: rgba(255, 255, 255, 0.9);
         border-radius: 30px;
         box-shadow: 0 20px 50px rgba(80, 50, 100, 0.25);
         backdrop-filter: blur(10px);
      }

      h1 {
         margin: 0 0 20px;
         text-align: center;
         color: #6b4c7a;
         font-size: 28px;
         letter-spacing: 1px;
      }

      #display {
         width: 100%;
         height: 75px;
         margin-bottom: 20px;
         padding: 15px;
         border: none;
         border-radius: 18px;
         background: #f5edf8;
         color: #4b3854;
         font-size: 32px;
         font-weight: 600;
         text-align: right;
         box-shadow: inset 0 3px 8px rgba(80, 50, 100, 0.1);
      }

      .buttons {
         display: grid;
         grid-template-columns: repeat(4, 1fr);
         gap: 10px;
      }

      .buttons button {
         height: 60px;
         border: none;
         border-radius: 18px;
         background: #eee3f5;
         color: #5c4667;
         font-size: 21px;
         font-weight: 600;
         cursor: pointer;
         transition: all 0.2s ease;
         box-shadow: 0 4px 8px rgba(80, 50, 100, 0.12);
      }

      .buttons button:hover {
         transform: translateY(-3px);
         box-shadow: 0 7px 14px rgba(80, 50, 100, 0.18);
         background: #e4d5ed;
      }

      .buttons button:active {
         transform: scale(0.94);
      }

      /* Operator buttons */
      .buttons button:nth-child(4),
      .buttons button:nth-child(8),
      .buttons button:nth-child(12),
      .buttons button:nth-child(16) {
         background: #d9b8e8;
         color: #54345f;
      }

      .buttons button:nth-child(4):hover,
      .buttons button:nth-child(8):hover,
      .buttons button:nth-child(12):hover,
      .buttons button:nth-child(16):hover {
         background: #cba4df;
      }

      /* Clear button */
      .buttons button:nth-child(14) {
         background: #f3b6c8;
         color: #743c50;
      }

      .buttons button:nth-child(14):hover {
         background: #ec9fb6;
      }

      /* Equals button */
      .buttons button:nth-child(15) {
         background: #a98bd4;
         color: white;
      }

      .buttons button:nth-child(15):hover {
         background: #9473c5;
      }
   </style>
</head>

<body>

   <div class="calculator">

      <h1>✨ Calculator</h1>

      <!-- Calculator display -->
      <input type="text" id="display" value="0" readonly>

      <!-- Calculator buttons -->
      <div class="buttons">

         <button onclick="appendValue('7')">7</button>
         <button onclick="appendValue('8')">8</button>
         <button onclick="appendValue('9')">9</button>
         <button onclick="setOperator('+')">+</button>

         <button onclick="appendValue('4')">4</button>
         <button onclick="appendValue('5')">5</button>
         <button onclick="appendValue('6')">6</button>
         <button onclick="setOperator('-')">−</button>

         <button onclick="appendValue('1')">1</button>
         <button onclick="appendValue('2')">2</button>
         <button onclick="appendValue('3')">3</button>
         <button onclick="setOperator('*')">×</button>

         <button onclick="appendValue('0')">0</button>
         <button onclick="clearDisplay()">C</button>
         <button onclick="calculate()">=</button>
         <button onclick="setOperator('/')">÷</button>

      </div>

   </div>

   <script>
      // Declare variables to store calculator values
      let firstNumber = "";
      let operator = "";
      let secondNumber = "";

      // Function to add numbers to the display
      function appendValue(value) {
         const display = document.getElementById("display");

         if (display.value === "0") {
            display.value = value;
         } else {
            display.value += value;
         }
      }

      // Function to store the operator and first number
      function setOperator(op) {
         const display = document.getElementById("display");

         firstNumber = display.value;
         operator = op;
         display.value = "";
      }

      // Function to perform the calculation
      function calculate() {
         const display = document.getElementById("display");
         secondNumber = display.value;

         let result = 0;

         if (operator === "+") {
            result = Number(firstNumber) + Number(secondNumber);
         } else if (operator === "-") {
            result = Number(firstNumber) - Number(secondNumber);
         } else if (operator === "*") {
            result = Number(firstNumber) * Number(secondNumber);
         } else if (operator === "/") {
            result = Number(firstNumber) / Number(secondNumber);
         }

         display.value = result;
      }

      // Function to clear the calculator display
      function clearDisplay() {
         document.getElementById("display").value = "0";
         firstNumber = "";
         operator = "";
         secondNumber = "";
      }
   </script>

</body>
</html>
